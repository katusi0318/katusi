<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro - タスク管理</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 3px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-full flex flex-col transition-colors duration-200">

    <!-- トースト通知コンテナ -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- ヘッダー -->
    <header class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
                    <i data-lucide="check-square" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent dark:from-indigo-400 dark:to-violet-400">
                        TaskFlow Pro
                    </h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">スマートなタスク管理</p>
                </div>
            </div>

            <!-- アカウント / アクション -->
            <div class="flex items-center gap-3">
                <!-- ダークモード切り替え -->
                <button id="themeToggleBtn" class="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" title="テーマ切り替え">
                    <i data-lucide="sun" id="sunIcon" class="w-5 h-5 hidden"></i>
                    <i data-lucide="moon" id="moonIcon" class="w-5 h-5"></i>
                </button>

                <!-- ログイン未完了時 -->
                <div id="loggedOutView" class="flex items-center">
                    <button id="googleLoginBtn" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-xl text-sm transition-all shadow-md hover:shadow-lg shadow-indigo-500/20">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                            <path d="M12.24 10.285V13.4h6.887C18.2 15.653 15.645 18 12.24 18c-3.315 0-6-2.685-6-6s2.685-6 6-6c1.485 0 2.835.54 3.885 1.44l2.43-2.43C16.995 3.51 14.775 2.7 12.24 2.7 7.14 2.7 3 6.84 3 11.94s4.14 9.24 9.24 9.24c5.34 0 8.88-3.75 8.88-9.04 0-.615-.06-1.215-.165-1.855H12.24z"/>
                        </svg>
                        <span>Googleでログイン</span>
                    </button>
                </div>

                <!-- ログイン完了時 -->
                <div id="loggedInView" class="hidden flex items-center gap-3">
                    <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-700/50 p-1.5 pr-3 rounded-full border border-slate-200 dark:border-slate-700">
                        <img id="userAvatar" src="" alt="User" class="w-7 h-7 rounded-full object-cover border border-white dark:border-slate-600">
                        <span id="userName" class="text-xs font-semibold max-w-[120px] truncate">ユーザー名</span>
                    </div>
                    <button id="logoutBtn" class="p-2 text-slate-400 hover:text-red-500 dark:hover:text-red-400 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" title="ログアウト">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6">

        <!-- 未ログインプレースホルダー -->
        <div id="loginPrompt" class="my-auto py-16 flex flex-col items-center justify-center text-center">
            <div class="w-20 h-20 bg-indigo-50 dark:bg-indigo-950/50 border border-indigo-100 dark:border-indigo-900 rounded-3xl flex items-center justify-center text-indigo-600 dark:text-indigo-400 mb-6 shadow-inner">
                <i data-lucide="shield-check" class="w-10 h-10"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">ログインしてタスクを管理</h2>
            <p class="text-slate-500 dark:text-slate-400 max-w-md mb-8 text-sm">
                Googleアカウントでログインすると、クラウド（Firebase）上でリアルタイムにタスクが同期されます。
            </p>
            <button id="mainLoginBtn" class="flex items-center gap-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-2xl transition-all shadow-lg shadow-indigo-500/25 hover:scale-[1.02]">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M12.24 10.285V13.4h6.887C18.2 15.653 15.645 18 12.24 18c-3.315 0-6-2.685-6-6s2.685-6 6-6c1.485 0 2.835.54 3.885 1.44l2.43-2.43C16.995 3.51 14.775 2.7 12.24 2.7 7.14 2.7 3 6.84 3 11.94s4.14 9.24 9.24 9.24c5.34 0 8.88-3.75 8.88-9.04 0-.615-.06-1.215-.165-1.855H12.24z"/>
                </svg>
                <span>Google アカウントで続行</span>
            </button>
        </div>

        <!-- アプリケーションコンテンツ（ログイン後表示） -->
        <div id="appContent" class="hidden flex-1 flex flex-col gap-6">

            <!-- ダッシュボード・統計カード -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">全タスク</p>
                        <p id="statTotal" class="text-2xl font-bold mt-1">0</p>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 flex items-center justify-center">
                        <i data-lucide="layers" class="w-5 h-5"></i>
                    </div>
                </div>

                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">未完了</p>
                        <p id="statPending" class="text-2xl font-bold mt-1 text-amber-600 dark:text-amber-400">0</p>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-amber-50 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 flex items-center justify-center">
                        <i data-lucide="clock" class="w-5 h-5"></i>
                    </div>
                </div>

                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">完了済み</p>
                        <p id="statCompleted" class="text-2xl font-bold mt-1 text-emerald-600 dark:text-emerald-400">0</p>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 flex items-center justify-center">
                        <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                    </div>
                </div>

                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">進捗率</p>
                        <p id="statProgress" class="text-2xl font-bold mt-1 text-indigo-600 dark:text-indigo-400">0%</p>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
                        <i data-lucide="trending-up" class="w-5 h-5"></i>
                    </div>
                </div>
            </div>

            <!-- コントロールバー（検索・フィルタ・新規作成ボタン） -->
            <div class="flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm">
                <!-- 検索バー -->
                <div class="relative flex-1">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="タスク名や説明で検索..." class="w-full pl-9 pr-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                </div>

                <div class="flex flex-wrap items-center gap-2">
                    <!-- ステータスフィルター -->
                    <select id="statusFilter" class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs sm:text-sm rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="all">すべてのステータス</option>
                        <option value="todo">未着手 (To Do)</option>
                        <option value="in_progress">進行中 (In Progress)</option>
                        <option value="completed">完了 (Done)</option>
                    </select>

                    <!-- 優先度フィルター -->
                    <select id="priorityFilter" class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs sm:text-sm rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="all">すべての優先度</option>
                        <option value="high">高 優先度</option>
                        <option value="medium">中 優先度</option>
                        <option value="low">低 優先度</option>
                    </select>

                    <!-- ビュー切り替え -->
                    <div class="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-xl border border-slate-200 dark:border-slate-700">
                        <button id="viewListBtn" class="p-1.5 rounded-lg bg-white dark:bg-slate-800 shadow-sm text-indigo-600 dark:text-indigo-400 transition-all" title="リスト表示">
                            <i data-lucide="list" class="w-4 h-4"></i>
                        </button>
                        <button id="viewBoardBtn" class="p-1.5 rounded-lg text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 transition-all" title="カンバンボード表示">
                            <i data-lucide="kanban" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <!-- タスク追加ボタン -->
                    <button id="openCreateModalBtn" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-xl transition-all shadow-md shadow-indigo-500/20 ml-auto md:ml-0">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>新規タスク</span>
                    </button>
                </div>
            </div>

            <!-- リストビュー表示エリア -->
            <div id="listViewContainer" class="flex-1 flex flex-col gap-3">
                <div id="taskList" class="space-y-3">
                    <!-- タスクアイテムが動的に挿入されます -->
                </div>
                <div id="emptyListState" class="hidden py-16 text-center text-slate-400 dark:text-slate-500">
                    <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-3 opacity-50"></i>
                    <p class="text-sm font-medium">該当するタスクが見つかりません</p>
                </div>
            </div>

            <!-- カンバンボードビュー表示エリア -->
            <div id="boardViewContainer" class="hidden flex-1 grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- To Do コラム -->
                <div class="bg-slate-100/70 dark:bg-slate-800/50 border border-slate-200/80 dark:border-slate-700/80 rounded-2xl p-4 flex flex-col">
                    <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-200 dark:border-slate-700">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                            <h3 class="font-semibold text-sm">未着手 (To Do)</h3>
                        </div>
                        <span id="countTodo" class="text-xs bg-slate-200 dark:bg-slate-700 px-2 py-0.5 rounded-full font-medium">0</span>
                    </div>
                    <div id="colTodo" class="flex-1 space-y-3 min-h-[150px] custom-scrollbar overflow-y-auto"></div>
                </div>

                <!-- In Progress コラム -->
                <div class="bg-slate-100/70 dark:bg-slate-800/50 border border-slate-200/80 dark:border-slate-700/80 rounded-2xl p-4 flex flex-col">
                    <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-200 dark:border-slate-700">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                            <h3 class="font-semibold text-sm">進行中 (In Progress)</h3>
                        </div>
                        <span id="countInProgress" class="text-xs bg-slate-200 dark:bg-slate-700 px-2 py-0.5 rounded-full font-medium">0</span>
                    </div>
                    <div id="colInProgress" class="flex-1 space-y-3 min-h-[150px] custom-scrollbar overflow-y-auto"></div>
                </div>

                <!-- Done コラム -->
                <div class="bg-slate-100/70 dark:bg-slate-800/50 border border-slate-200/80 dark:border-slate-700/80 rounded-2xl p-4 flex flex-col">
                    <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-200 dark:border-slate-700">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                            <h3 class="font-semibold text-sm">完了 (Done)</h3>
                        </div>
                        <span id="countDone" class="text-xs bg-slate-200 dark:bg-slate-700 px-2 py-0.5 rounded-full font-medium">0</span>
                    </div>
                    <div id="colDone" class="flex-1 space-y-3 min-h-[150px] custom-scrollbar overflow-y-auto"></div>
                </div>
            </div>

        </div>
    </main>

    <!-- タスク作成/編集 モーダル -->
    <div id="taskModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 transform scale-95 transition-transform duration-200" id="taskModalContent">
            <div class="flex items-center justify-between pb-4 border-b border-slate-200 dark:border-slate-700 mb-4">
                <h3 id="modalTitle" class="text-lg font-bold">新規タスクの作成</h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="taskForm" class="space-y-4">
                <input type="hidden" id="taskId">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">タイトル <span class="text-red-500">*</span></label>
                    <input type="text" id="taskTitle" required placeholder="タスクのタイトルを入力" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">詳細メモ</label>
                    <textarea id="taskDescription" rows="3" placeholder="詳細やメモを追加..." class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">ステータス</label>
                        <select id="taskStatus" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="todo">未着手 (To Do)</option>
                            <option value="in_progress">進行中 (In Progress)</option>
                            <option value="completed">完了 (Done)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">優先度</label>
                        <select id="taskPriority" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="low">低 (Low)</option>
                            <option value="medium" selected>中 (Medium)</option>
                            <option value="high">高 (High)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">期限日</label>
                        <input type="date" id="taskDueDate" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">カテゴリ/タグ</label>
                        <input type="text" id="taskCategory" placeholder="例: 仕事, 個人, 勉強" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div class="flex items-center justify-end gap-2 pt-4 border-t border-slate-200 dark:border-slate-700 mt-6">
                    <button type="button" id="cancelModalBtn" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                        キャンセル
                    </button>
                    <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold transition-all shadow-md shadow-indigo-500/20">
                        保存する
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 削除確認モーダル -->
    <div id="deleteConfirmModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 text-center">
            <div class="w-12 h-12 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="alert-triangle" class="w-6 h-6"></i>
            </div>
            <h3 class="text-base font-bold mb-2">タスクを削除しますか？</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mb-6">この操作は取り消すことができません。</p>
            <div class="flex items-center justify-center gap-3">
                <button id="cancelDeleteBtn" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                    キャンセル
                </button>
                <button id="confirmDeleteBtn" class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white text-sm font-semibold transition-colors shadow-md shadow-red-500/20">
                    削除する
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase App スクリプト -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            doc, 
            onSnapshot, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCwDNwKhNxJAQzbwVMMkxbe1ixKSohguLo",
            authDomain: "task10-482fb.firebaseapp.com",
            projectId: "task10-482fb",
            storageBucket: "task10-482fb.firebasestorage.app",
            messagingSenderId: "828086724027",
            appId: "1:828086724027:web:1cbdd2106508f69775d09e",
            measurementId: "G-2RLRHD8HKQ"
        };

        // Firebase Initialize
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        // Application Global States
        let currentUser = null;
        let unsubscribeTasks = null;
        let tasksList = [];
        let currentView = 'list'; // 'list' | 'board'
        let pendingDeleteTaskId = null;

        // UI DOM Elements
        const loggedOutView = document.getElementById('loggedOutView');
        const loggedInView = document.getElementById('loggedInView');
        const loginPrompt = document.getElementById('loginPrompt');
        const appContent = document.getElementById('appContent');
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');

        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const mainLoginBtn = document.getElementById('mainLoginBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        const taskModal = document.getElementById('taskModal');
        const taskModalContent = document.getElementById('taskModalContent');
        const openCreateModalBtn = document.getElementById('openCreateModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const taskForm = document.getElementById('taskForm');
        const modalTitle = document.getElementById('modalTitle');

        const deleteConfirmModal = document.getElementById('deleteConfirmModal');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');

        const searchInput = document.getElementById('searchInput');
        const statusFilter = document.getElementById('statusFilter');
        const priorityFilter = document.getElementById('priorityFilter');
        const viewListBtn = document.getElementById('viewListBtn');
        const viewBoardBtn = document.getElementById('viewBoardBtn');
        const listViewContainer = document.getElementById('listViewContainer');
        const boardViewContainer = document.getElementById('boardViewContainer');

        // Theme Toggle Handler
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');

        function initTheme() {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            }
        }

        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            sunIcon.classList.toggle('hidden', !isDark);
            moonIcon.classList.toggle('hidden', isDark);
        });

        // Toast Helper
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : 'bg-slate-800';
            toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 text-sm pointer-events-auto transform transition-all duration-300 translate-y-2 opacity-0`;
            
            const iconName = type === 'success' ? 'check-circle' : type === 'error' ? 'alert-circle' : 'info';
            toast.innerHTML = `<i data-lucide="${iconName}" class="w-4 h-4"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons({ targets: [toast] });

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Authentication State Listener
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                // Logged In
                userAvatar.src = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || 'User')}`;
                userName.textContent = user.displayName || 'ユーザー';
                
                loggedOutView.classList.add('hidden');
                loggedInView.classList.remove('hidden');
                loginPrompt.classList.add('hidden');
                appContent.classList.remove('hidden');

                // Task subscription
                subscribeToTasks(user.uid);
            } else {
                // Logged Out
                loggedOutView.classList.remove('hidden');
                loggedInView.classList.add('hidden');
                loginPrompt.classList.remove('hidden');
                appContent.classList.add('hidden');

                if (unsubscribeTasks) unsubscribeTasks();
                tasksList = [];
            }
        });

        // Google Login Action
        async function handleLogin() {
            try {
                await signInWithPopup(auth, googleProvider);
                showToast('ログインしました', 'success');
            } catch (error) {
                console.error("Login Error:", error);
                showToast(`ログインエラー: ${error.message}`, 'error');
            }
        }

        // Logout Action
        async function handleLogout() {
            try {
                await signOut(auth);
                showToast('ログアウトしました', 'info');
            } catch (error) {
                console.error("Logout Error:", error);
                showToast('ログアウトに失敗しました', 'error');
            }
        }

        googleLoginBtn.addEventListener('click', handleLogin);
        mainLoginBtn.addEventListener('click', handleLogin);
        logoutBtn.addEventListener('click', handleLogout);

        // Firestore Realtime Task Listener
        function subscribeToTasks(userId) {
            if (unsubscribeTasks) unsubscribeTasks();

            const tasksRef = collection(db, 'users', userId, 'tasks');
            unsubscribeTasks = onSnapshot(tasksRef, (snapshot) => {
                tasksList = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                
                // Client side sorting (createdAt desc)
                tasksList.sort((a, b) => {
                    const timeA = a.createdAt?.seconds || 0;
                    const timeB = b.createdAt?.seconds || 0;
                    return timeB - timeA;
                });

                renderTasks();
                updateStats();
            }, (error) => {
                console.error("Firestore Listen Error:", error);
                showToast('データの取得中にエラーが発生しました', 'error');
            });
        }

        // Modal Controls
        function openModal(task = null) {
            taskForm.reset();
            if (task) {
                modalTitle.textContent = 'タスクの編集';
                document.getElementById('taskId').value = task.id;
                document.getElementById('taskTitle').value = task.title || '';
                document.getElementById('taskDescription').value = task.description || '';
                document.getElementById('taskStatus').value = task.status || 'todo';
                document.getElementById('taskPriority').value = task.priority || 'medium';
                document.getElementById('taskDueDate').value = task.dueDate || '';
                document.getElementById('taskCategory').value = task.category || '';
            } else {
                modalTitle.textContent = '新規タスクの作成';
                document.getElementById('taskId').value = '';
            }

            taskModal.classList.remove('hidden');
            setTimeout(() => {
                taskModal.classList.remove('opacity-0');
                taskModalContent.classList.remove('scale-95');
                taskModalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            taskModalContent.classList.remove('scale-100');
            taskModalContent.classList.add('scale-95');
            taskModal.classList.add('opacity-0');
            setTimeout(() => {
                taskModal.classList.add('hidden');
            }, 200);
        }

        openCreateModalBtn.addEventListener('click', () => openModal());
        closeModalBtn.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);

        // Form Submit Handler (Add / Update Task)
        taskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const taskId = document.getElementById('taskId').value;
            const taskData = {
                title: document.getElementById('taskTitle').value.trim(),
                description: document.getElementById('taskDescription').value.trim(),
                status: document.getElementById('taskStatus').value,
                priority: document.getElementById('taskPriority').value,
                dueDate: document.getElementById('taskDueDate').value,
                category: document.getElementById('taskCategory').value.trim(),
                updatedAt: serverTimestamp()
            };

            try {
                if (taskId) {
                    // Update
                    const taskRef = doc(db, 'users', currentUser.uid, 'tasks', taskId);
                    await updateDoc(taskRef, taskData);
                    showToast('タスクを更新しました', 'success');
                } else {
                    // Create
                    taskData.createdAt = serverTimestamp();
                    const tasksRef = collection(db, 'users', currentUser.uid, 'tasks');
                    await addDoc(tasksRef, taskData);
                    showToast('新規タスクを作成しました', 'success');
                }
                closeModal();
            } catch (error) {
                console.error("Task Save Error:", error);
                showToast('保存中にエラーが発生しました', 'error');
            }
        });

        // Delete Confirm Handling
        function openDeleteConfirm(taskId) {
            pendingDeleteTaskId = taskId;
            deleteConfirmModal.classList.remove('hidden');
            setTimeout(() => deleteConfirmModal.classList.remove('opacity-0'), 10);
        }

        function closeDeleteConfirm() {
            deleteConfirmModal.classList.add('opacity-0');
            setTimeout(() => {
                deleteConfirmModal.classList.add('hidden');
                pendingDeleteTaskId = null;
            }, 200);
        }

        cancelDeleteBtn.addEventListener('click', closeDeleteConfirm);

        confirmDeleteBtn.addEventListener('click', async () => {
            if (!pendingDeleteTaskId || !currentUser) return;
            try {
                const taskRef = doc(db, 'users', currentUser.uid, 'tasks', pendingDeleteTaskId);
                await deleteDoc(taskRef);
                showToast('タスクを削除しました', 'info');
            } catch (error) {
                console.error("Delete Error:", error);
                showToast('削除に失敗しました', 'error');
            } finally {
                closeDeleteConfirm();
            }
        });

        // Fast Status Toggle Action
        async function toggleTaskStatus(taskId, currentStatus) {
            if (!currentUser) return;
            const nextStatus = currentStatus === 'completed' ? 'todo' : 'completed';
            try {
                const taskRef = doc(db, 'users', currentUser.uid, 'tasks', taskId);
                await updateDoc(taskRef, { status: nextStatus, updatedAt: serverTimestamp() });
                showToast(nextStatus === 'completed' ? 'タスクを完了にしました' : 'タスクを未着手に戻しました', 'success');
            } catch (error) {
                console.error("Status Toggle Error:", error);
                showToast('更新エラー', 'error');
            }
        }

        // Filter & Search tasks
        function getFilteredTasks() {
            const query = searchInput.value.toLowerCase().trim();
            const status = statusFilter.value;
            const priority = priorityFilter.value;

            return tasksList.filter(task => {
                const matchesSearch = (task.title || '').toLowerCase().includes(query) ||
                                      (task.description || '').toLowerCase().includes(query) ||
                                      (task.category || '').toLowerCase().includes(query);
                
                const matchesStatus = status === 'all' || task.status === status;
                const matchesPriority = priority === 'all' || task.priority === priority;

                return matchesSearch && matchesStatus && matchesPriority;
            });
        }

        // Update Statistics Counters
        function updateStats() {
            const total = tasksList.length;
            const completed = tasksList.filter(t => t.status === 'completed').length;
            const pending = total - completed;
            const progress = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statPending').textContent = pending;
            document.getElementById('statCompleted').textContent = completed;
            document.getElementById('statProgress').textContent = `${progress}%`;
        }

        // Render Task Items (List & Board)
        function renderTasks() {
            const filtered = getFilteredTasks();

            if (currentView === 'list') {
                renderListView(filtered);
            } else {
                renderBoardView(filtered);
            }
            lucide.createIcons();
        }

        // Priority Badge HTML Builder
        function getPriorityBadge(priority) {
            if (priority === 'high') {
                return `<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-red-100 dark:bg-red-900/40 text-red-600 dark:text-red-400">高</span>`;
            } else if (priority === 'low') {
                return `<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400">低</span>`;
            }
            return `<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-amber-100 dark:bg-amber-900/40 text-amber-600 dark:text-amber-400">中</span>`;
        }

        // Status Badge HTML Builder
        function getStatusBadge(status) {
            if (status === 'completed') {
                return `<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400">完了</span>`;
            } else if (status === 'in_progress') {
                return `<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-purple-100 dark:bg-purple-900/40 text-purple-600 dark:text-purple-400">進行中</span>`;
            }
            return `<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300">未着手</span>`;
        }

        // Render List View
        function renderListView(tasks) {
            const container = document.getElementById('taskList');
            const emptyState = document.getElementById('emptyListState');
            container.innerHTML = '';

            if (tasks.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            tasks.forEach(task => {
                const isDone = task.status === 'completed';
                const item = document.createElement('div');
                item.className = `bg-white dark:bg-slate-800 border ${isDone ? 'border-slate-200 dark:border-slate-800 opacity-75' : 'border-slate-200/80 dark:border-slate-700/80'} p-4 rounded-2xl shadow-sm hover:shadow-md transition-all flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4`;

                item.innerHTML = `
                    <div class="flex items-start gap-3 flex-1 min-w-0">
                        <button class="toggle-btn mt-0.5 w-5 h-5 rounded-md border ${isDone ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 dark:border-slate-600 hover:border-indigo-500'} flex items-center justify-center transition-colors">
                            ${isDone ? '<i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>' : ''}
                        </button>
                        <div class="flex-1 min-w-0">
                            <div class="flex flex-wrap items-center gap-2 mb-1">
                                <h4 class="font-semibold text-sm ${isDone ? 'line-through text-slate-400 dark:text-slate-500' : ''} truncate">${escapeHtml(task.title)}</h4>
                                ${getStatusBadge(task.status)}
                                ${getPriorityBadge(task.priority)}
                                ${task.category ? `<span class="bg-slate-100 dark:bg-slate-700/50 text-slate-500 dark:text-slate-400 px-2 py-0.5 rounded-md text-xs font-medium">#${escapeHtml(task.category)}</span>` : ''}
                            </div>
                            ${task.description ? `<p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 mb-1">${escapeHtml(task.description)}</p>` : ''}
                            ${task.dueDate ? `<div class="flex items-center gap-1 text-xs text-slate-400"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> <span>期日: ${task.dueDate}</span></div>` : ''}
                        </div>
                    </div>
                    <div class="flex items-center gap-1 self-end sm:self-center">
                        <button class="edit-btn p-1.5 text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" title="編集">
                            <i data-lucide="edit-3" class="w-4 h-4"></i>
                        </button>
                        <button class="delete-btn p-1.5 text-slate-400 hover:text-red-600 dark:hover:text-red-400 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" title="削除">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;

                // Event Listeners
                item.querySelector('.toggle-btn').addEventListener('click', () => toggleTaskStatus(task.id, task.status));
                item.querySelector('.edit-btn').addEventListener('click', () => openModal(task));
                item.querySelector('.delete-btn').addEventListener('click', () => openDeleteConfirm(task.id));

                container.appendChild(item);
            });
        }

        // Render Kanban Board View
        function renderBoardView(tasks) {
            const colTodo = document.getElementById('colTodo');
            const colInProgress = document.getElementById('colInProgress');
            const colDone = document.getElementById('colDone');

            colTodo.innerHTML = '';
            colInProgress.innerHTML = '';
            colDone.innerHTML = '';

            let countTodo = 0, countInProgress = 0, countDone = 0;

            tasks.forEach(task => {
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-slate-800 p-3.5 rounded-xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm space-y-2 hover:shadow-md transition-all";

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <h4 class="font-semibold text-sm ${task.status === 'completed' ? 'line-through text-slate-400' : ''} truncate">${escapeHtml(task.title)}</h4>
                        ${getPriorityBadge(task.priority)}
                    </div>
                    ${task.description ? `<p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2">${escapeHtml(task.description)}</p>` : ''}
                    <div class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-700/50 text-xs text-slate-400">
                        <span>${task.dueDate ? `📅 ${task.dueDate}` : ''}</span>
                        <div class="flex items-center gap-1">
                            <button class="edit-card p-1 hover:text-indigo-600 dark:hover:text-indigo-400"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
                            <button class="delete-card p-1 hover:text-red-600 dark:hover:text-red-400"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                        </div>
                    </div>
                `;

                card.querySelector('.edit-card').addEventListener('click', () => openModal(task));
                card.querySelector('.delete-card').addEventListener('click', () => openDeleteConfirm(task.id));

                if (task.status === 'in_progress') {
                    colInProgress.appendChild(card);
                    countInProgress++;
                } else if (task.status === 'completed') {
                    colDone.appendChild(card);
                    countDone++;
                } else {
                    colTodo.appendChild(card);
                    countTodo++;
                }
            });

            document.getElementById('countTodo').textContent = countTodo;
            document.getElementById('countInProgress').textContent = countInProgress;
            document.getElementById('countDone').textContent = countDone;
        }

        // Helper: HTML Escape
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, match => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[match]));
        }

        // View Switches
        viewListBtn.addEventListener('click', () => {
            currentView = 'list';
            viewListBtn.className = "p-1.5 rounded-lg bg-white dark:bg-slate-800 shadow-sm text-indigo-600 dark:text-indigo-400 transition-all";
            viewBoardBtn.className = "p-1.5 rounded-lg text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 transition-all";
            listViewContainer.classList.remove('hidden');
            boardViewContainer.classList.add('hidden');
            renderTasks();
        });

        viewBoardBtn.addEventListener('click', () => {
            currentView = 'board';
            viewBoardBtn.className = "p-1.5 rounded-lg bg-white dark:bg-slate-800 shadow-sm text-indigo-600 dark:text-indigo-400 transition-all";
            viewListBtn.className = "p-1.5 rounded-lg text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 transition-all";
            boardViewContainer.classList.remove('hidden');
            listViewContainer.classList.add('hidden');
            renderTasks();
        });

        // Filter / Search Listeners
        searchInput.addEventListener('input', renderTasks);
        statusFilter.addEventListener('change', renderTasks);
        priorityFilter.addEventListener('change', renderTasks);

        // App Initialization
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            lucide.createIcons();
        });
    </script>
</body>
</html>
